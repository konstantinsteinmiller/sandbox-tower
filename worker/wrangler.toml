name = "sandbox-tower-leaderboard"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Fill `database_id` in after `wrangler d1 create sandbox-tower-leaderboard` —
# the command prints it.
#
# The previous value here was tower-siege's PRODUCTION D1 database id. It has
# been replaced with a placeholder on purpose: this reskin must not deploy
# against the old game's live leaderboard database. Run `wrangler d1 create`
# for THIS game and paste the id it prints below before deploying the Worker.
[[d1_databases]]
binding = "DB"
database_name = "sandbox-tower-leaderboard"
database_id = "REPLACE_ME_after_wrangler_d1_create"

[vars]
# Comma-separated origins allowed to call the API. Leave empty while you are
# still collecting the real portal origins: portal builds are served from a
# different host per portal, and sandboxed iframes send `Origin: null`, so an
# early allowlist mostly locks out your own game.
ALLOWED_ORIGINS = ""

# SCORE_SECRET is NOT set here. If you want signed submissions:
#   wrangler secret put SCORE_SECRET
# and set the same value as VITE_LEADERBOARD_SECRET in the game build. Note
# that this raises the bar rather than closing the door — the secret ships
# inside a public bundle, so it stops replayed and hand-rolled POSTs, not a
# determined player with devtools. The score bound in `plausible()` is what
# actually caps the damage.
