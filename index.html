<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="/favicon.ico">
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6fc3f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sandbox Tower">
  <meta name="description" content="Build a sandcastle of toy blasters, squash endless waves of garden bugs, and rebuild it taller every run.">
  <link rel="manifest" href="/manifest.json">
  <link rel="preload" as="image" href="/images/logo/logo_256x256.webp" type="image/webp">
  <title>Sandbox Tower</title>
  <style>
      /* The splash paints before any JS runs, so its colours are inlined here
         rather than pulled from the app's stylesheet. A sunny sky fading into
         the sandbox, the same noon palette the scene opens on, so the handover
         to the canvas is one continuous colour with no flash between them. */
      body {
          margin: 0;
          background-color: #8fd0f5;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background:
              radial-gradient(circle at 78% 16%, rgba(255, 244, 196, 0.95) 0 5vmin, rgba(255, 236, 160, 0.35) 9vmin, rgba(255, 236, 160, 0) 22vmin),
              linear-gradient(180deg, #6fc3f7 0%, #a9dcf9 38%, #d6f0ff 56%, #f6e2ae 70%, #e3c07e 100%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      /* A procedurally-drawn sandcastle built from CSS boxes: three bucket-
         moulded tiers, each narrower than the one below, that pulse in
         sequence, with a paper flag on top. Zero bytes, and it previews the
         game's actual subject instead of a generic spinner. The ink contour is
         a stack of drop-shadows on the parent, so it follows the clipped
         bucket silhouette of every tier. */
      .splash-tower {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.5vmin;
          padding-top: 7vmin;
          filter: drop-shadow(0.45vmin 0 0 #6e4d2a) drop-shadow(-0.45vmin 0 0 #6e4d2a)
                  drop-shadow(0 0.45vmin 0 #6e4d2a) drop-shadow(0 -0.45vmin 0 #6e4d2a);
      }

      /* The sand mound the castle stands on. */
      .splash-tower::after {
          content: '';
          position: absolute;
          left: 50%;
          bottom: -2.4vmin;
          width: 30vmin;
          height: 5vmin;
          translate: -50% 0;
          border-radius: 50%;
          background: radial-gradient(ellipse at 50% 30%, #f6e2ae, #e3c07e 60%, #c79a5c);
          z-index: -1;
      }

      .splash-tower i {
          position: relative;
          display: block;
          width: 9vmin;
          height: 8vmin;
          /* Bucket mould: a trapezoid, wider at the base. */
          clip-path: polygon(9% 0, 91% 0, 100% 100%, 0 100%);
          background-image:
              repeating-linear-gradient(180deg, rgba(255, 255, 255, 0) 0 1.7vmin, rgba(150, 105, 50, 0.28) 1.7vmin 2vmin),
              linear-gradient(100deg, #fbecc4 0%, #f0d596 30%, #e3c07e 62%, #b88c4c 100%);
          animation: splash-block 1.4s ease-in-out infinite;
      }

      /* Top tier: small, crenellated, flag on top. */
      .splash-tower i:nth-of-type(1) {
          z-index: 3;
          width: 8vmin;
          height: 6.5vmin;
          clip-path: polygon(0 0, 18% 0, 18% 22%, 41% 22%, 41% 0, 59% 0, 59% 22%, 82% 22%, 82% 0, 100% 0, 100% 100%, 0 100%);
      }

      .splash-tower i:nth-of-type(2) {
          z-index: 2;
          width: 12vmin;
          animation-delay: 0.16s;
      }

      /* Bottom tier: the widest, with the gate's dark arch. */
      .splash-tower i:nth-of-type(3) {
          z-index: 1;
          width: 16vmin;
          height: 9vmin;
          animation-delay: 0.32s;
          background-image:
              radial-gradient(2.6vmin 3.6vmin at 50% 100%, #7a5530 96%, rgba(122, 85, 48, 0) 100%),
              repeating-linear-gradient(180deg, rgba(255, 255, 255, 0) 0 1.7vmin, rgba(150, 105, 50, 0.28) 1.7vmin 2vmin),
              linear-gradient(100deg, #fbecc4 0%, #f0d596 30%, #e3c07e 62%, #b88c4c 100%);
      }

      /* The paper flag on a toothpick. Lives on the tower (not a clipped
         tier) so the bucket clip cannot cut it off. */
      .splash-flag {
          position: absolute;
          top: 0;
          left: 50%;
          width: 5vmin;
          height: 7.4vmin;
          margin-left: -0.25vmin;
          background:
              linear-gradient(to top right, #e5483b 49%, rgba(229, 72, 59, 0) 52%) 0.5vmin 0 / 4.2vmin 1.7vmin no-repeat,
              linear-gradient(to bottom right, #e5483b 49%, rgba(229, 72, 59, 0) 52%) 0.5vmin 1.7vmin / 4.2vmin 1.7vmin no-repeat,
              linear-gradient(90deg, #fff6dc, #d9b77a) 0 0 / 0.5vmin 100% no-repeat;
          transform-origin: 0 100%;
          animation: splash-flag 1.4s ease-in-out infinite;
      }

      @keyframes splash-block {
          0%, 100% { opacity: 0.45; transform: translateY(0); }
          50%      { opacity: 1;    transform: translateY(-0.8vmin); }
      }

      @keyframes splash-flag {
          0%, 100% { transform: skewY(0deg); }
          50%      { transform: skewY(-6deg); }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <div class="splash-tower" role="img" aria-label="Sandbox Tower">
    <span class="splash-flag"></span>
    <i></i><i></i><i></i>
  </div>
</div>
